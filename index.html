<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Split rent and bills fairly by percentage, room size or fixed amounts, rounded to the exact cent." />
    <meta name="theme-color" content="#f6f7f1" />
    <meta name="apple-mobile-web-app-title" content="SplitRight" />
    <script>
      // Apply the saved theme before first paint to avoid a flash
      try {
        var t = localStorage.getItem('sr-theme')
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = t
        document.querySelector('meta[name=theme-color]').content = t === 'dark' ? '#0a110d' : '#f6f7f1'
      } catch (e) {}
    </script>
    <title>SplitRight</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
